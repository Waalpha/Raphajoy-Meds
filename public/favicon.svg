<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="pharmacyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="128" height="128" rx="34" fill="url(#pharmacyGrad)"/>
  <!-- Subtle inner border highlight -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>
  <!-- Bold Medical Cross -->
  <g filter="url(#subtleShadow)">
    <path d="M48 24 C48 21.8 49.8 20 52 20 H76 C78.2 20 80 21.8 80 24 V48 H104 C106.2 48 108 49.8 108 52 V76 C108 78.2 106.2 80 104 80 H80 V104 C80 106.2 78.2 108 76 108 H52 C49.8 108 48 106.2 48 104 V80 H24 C21.8 80 20 78.2 20 76 V52 C20 49.8 21.8 48 24 48 H48 V24 Z" fill="#ffffff"/>
  </g>
  <!-- Distinctive Pharmacy Capsule Emblem in center -->
  <rect x="52" y="58" width="24" height="12" rx="6" fill="#059669"/>
  <!-- Pill divider line -->
  <line x1="64" y1="58" x2="64" y2="70" stroke="#ffffff" stroke-width="2"/>
  <!-- Medical Heart Accent -->
  <circle cx="64" cy="45" r="3.5" fill="#059669"/>
</svg>
